<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legendas PT-BR — guia / guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ---
   purpose: guia bilingue (PT/EN) do pipeline video -> .srt
   gotcha: todo o texto vem de DECKS no fim do arquivo; markup e gerado em render()
   --- */

:root{
  --letterbox:#0E1216;
  --panel:#161C22;
  --panel-2:#1D242B;
  --rule:#2B343D;
  --text:#E6EBF0;
  --muted:#95A3B1;
  --cue:#FFD34D;
  --cue-dim:rgba(255,211,77,.14);
  --ok:#7BD4A8;
  --shell:clamp(1.1rem,4vw,2.5rem);
  --col:70ch;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--letterbox);color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:clamp(15px,.4vw + 14px,17px);line-height:1.62;
  overflow-x:clip;
}
code,kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
code{
  font-size:.88em;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:4px;padding:.08em .34em;color:#F2E6BE;white-space:nowrap;
}
a{color:var(--cue);text-underline-offset:3px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;line-height:1.06;margin:0;letter-spacing:-.015em}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:1rem;justify-content:space-between;
  padding:.7rem var(--shell);
  background:rgba(14,18,22,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
}
.mark{display:flex;align-items:center;gap:.6rem;font-weight:600;font-size:.92rem}
.mark b{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.mark .dot{width:.62rem;height:.62rem;border-radius:2px;background:var(--cue);flex:0 0 auto}
.mark span{color:var(--muted);font-weight:400}
@media (max-width:560px){.mark span{display:none}}

.switch{
  position:relative;display:flex;padding:3px;gap:2px;
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;
}
.switch button{
  position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;
  font:inherit;font-size:.82rem;font-weight:600;letter-spacing:.01em;
  color:var(--muted);padding:.36rem .9rem;border-radius:999px;
  transition:color .22s ease;
}
.switch button[aria-pressed="true"]{color:#12161A}
.switch .thumb{
  position:absolute;z-index:0;top:3px;bottom:3px;left:3px;
  background:var(--cue);border-radius:999px;
  transition:transform .28s cubic-bezier(.4,.05,.2,1),width .28s cubic-bezier(.4,.05,.2,1);
}
@media (prefers-reduced-motion:reduce){.switch .thumb,.switch button{transition:none}}

/* ---------- layout ---------- */
main{padding:0 var(--shell) 5rem}
.wrap{max-width:min(74rem,100%);margin:0 auto}
section{padding:clamp(2.6rem,6vw,4.4rem) 0;border-top:1px solid var(--rule)}
section:first-of-type{border-top:0}
.lede,.body{max-width:var(--col)}
h2{font-size:clamp(1.5rem,3.4vw,2.15rem);margin-bottom:.9rem}
h3{font-size:1.05rem;font-weight:600;font-family:"IBM Plex Sans",sans-serif;letter-spacing:0}
.muted{color:var(--muted)}
.note{
  margin-top:1rem;max-width:var(--col);color:var(--muted);font-size:.93rem;
  border-left:2px solid var(--rule);padding-left:.85rem;
}

/* ---------- hero ---------- */
.hero{padding-top:clamp(2.2rem,6vw,4rem)}
.kicker{color:var(--cue);font-size:.82rem;font-weight:600;margin:0 0 .9rem}
.hero h1{font-size:clamp(2.3rem,7.2vw,4.6rem);max-width:16ch;margin-bottom:1.6rem}
.frame{
  position:relative;aspect-ratio:16/7;max-width:52rem;border-radius:10px;
  background:
    radial-gradient(120% 90% at 30% 20%,#233241 0%,#141A20 55%,#0B0F13 100%);
  border:1px solid var(--rule);overflow:hidden;display:flex;align-items:flex-end;
  justify-content:center;padding:0 6% 8%;
}
.frame::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  pointer-events:none;
}
.frame .tc{
  position:absolute;top:.9rem;left:1rem;font-size:.72rem;color:#7E8C99;
  letter-spacing:.06em;
}
.cue{
  font-size:clamp(1rem,2.5vw,1.5rem);font-weight:500;text-align:center;line-height:1.35;
  background:rgba(8,10,12,.72);padding:.35em .7em;border-radius:4px;
  text-shadow:0 2px 6px rgba(0,0,0,.6);max-width:26ch;
  opacity:0;transform:translateY(6px);animation:cuein .7s .35s ease forwards;
}
@keyframes cuein{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cue{opacity:1;transform:none;animation:none}}
.hero .lede{margin-top:1.7rem;font-size:1.05rem;color:var(--muted)}

/* ---------- flow ---------- */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:.55rem;margin-top:1.8rem}
.flow .node{
  flex:1 1 12rem;background:var(--panel);border:1px solid var(--rule);
  border-radius:8px;padding:.75rem .9rem;
}
.flow .node .f{font-size:.86rem;color:var(--text)}
.flow .node .n{font-size:.74rem;color:var(--muted);margin-top:.15rem}
.flow .link{align-self:center;color:var(--rule);flex:0 0 auto;width:1.4rem;height:1px;background:var(--rule)}
@media (max-width:620px){.flow{flex-direction:column}.flow .link{width:1px;height:1rem;margin-left:1.2rem}}

/* ---------- toc ---------- */
.toc{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:2.2rem}
.toc a{
  font-size:.82rem;color:var(--muted);text-decoration:none;
  border:1px solid var(--rule);border-radius:999px;padding:.28rem .75rem;
  transition:border-color .18s,color .18s;
}
.toc a:hover,.toc a:focus-visible{color:var(--text);border-color:var(--muted)}

/* ---------- steps (cue blocks) ---------- */
.step{display:grid;grid-template-columns:7.5rem 1fr;gap:0 1.6rem;padding:1.8rem 0;border-top:1px solid var(--rule)}
.step:first-of-type{border-top:0;padding-top:.4rem}
.gutter{position:sticky;top:4.6rem;align-self:start}
.gutter .n{
  font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:700;
  color:var(--cue);line-height:1;letter-spacing:-.04em;
}
.gutter .t{font-size:.75rem;color:var(--muted);margin-top:.3rem;letter-spacing:.02em}
.step h3{font-size:clamp(1.15rem,2.4vw,1.4rem);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin-bottom:.7rem;letter-spacing:-.01em}
@media (max-width:700px){
  .step{grid-template-columns:1fr;gap:.5rem}
  .gutter{position:static;display:flex;align-items:baseline;gap:.7rem}
  .gutter .n{font-size:1.7rem}.gutter .t{margin-top:0}
}
ol.acts{margin:1rem 0 0;padding:0;list-style:none;counter-reset:a;max-width:var(--col)}
ol.acts li{counter-increment:a;position:relative;padding:.55rem 0 .55rem 2.1rem;border-top:1px solid var(--rule)}
ol.acts li::before{
  content:counter(a);position:absolute;left:0;top:.55rem;
  width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--rule);
  display:grid;place-items:center;font-size:.72rem;color:var(--muted);
}
pre{
  margin:1.1rem 0 0;max-width:var(--col);overflow-x:auto;
  background:#0A0E12;border:1px solid var(--rule);border-radius:8px;padding:.85rem 1rem;
  font-family:"IBM Plex Mono",monospace;font-size:.84rem;line-height:1.7;color:#D7E3EC;
}
pre .p{color:var(--cue);user-select:none}

/* ---------- critical /content ---------- */
.crit{border:1px solid rgba(255,211,77,.4);border-radius:12px;background:linear-gradient(180deg,var(--cue-dim),transparent 60%);padding:clamp(1.2rem,3.5vw,2rem)}
.crit .flag{
  display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.04em;
  background:var(--cue);color:#12161A;border-radius:4px;padding:.15rem .5rem;margin-bottom:.9rem;
}
.crit h2{color:var(--cue)}
.split{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr);gap:1.5rem;margin-top:1.6rem;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.tree{background:#0A0E12;border:1px solid var(--rule);border-radius:8px;padding:1rem;font-family:"IBM Plex Mono",monospace;font-size:.83rem;line-height:1.9}
.tree .l{color:#68747F;white-space:nowrap}
.tree .l.hit{color:#12161A;background:var(--cue);border-radius:3px;padding:0 .35rem;font-weight:500}
.tree .l.file{color:var(--ok)}
.tree .root{color:var(--muted)}
.verdicts{display:flex;flex-direction:column;gap:.6rem}
.v{display:grid;grid-template-columns:1.5rem 1fr;gap:.7rem;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
.v .s{font-weight:700;line-height:1.3}
.v.yes{border-color:rgba(123,212,168,.45)}
.v.yes .s{color:var(--ok)}
.v.no .s{color:#F58A7C}
.v .p{font-size:.86rem;color:var(--muted)}
.v .p b{color:var(--text);font-weight:600;font-family:"IBM Plex Mono",monospace;font-size:.92em}

/* ---------- explainers ---------- */
.cards{display:grid;gap:.55rem;max-width:56rem;margin-top:1.6rem}
details.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;transition:border-color .2s ease,background .2s ease;
}
details.card[open]{border-color:#3D4A56;background:var(--panel-2)}
details.card:hover{border-color:#3D4A56}
summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:.9rem;
  padding:.95rem 1.05rem;font-weight:500;
}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--cue);outline-offset:-2px;border-radius:10px}
.chev{
  flex:0 0 auto;width:.95rem;height:.95rem;border-right:1.5px solid var(--cue);border-bottom:1.5px solid var(--cue);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s ease;
}
details[open] .chev{transform:rotate(225deg) translate(-2px,-2px)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.card .ans{padding:0 1.05rem 1.1rem 2.9rem;color:var(--muted);max-width:66ch}
.card .ans p:first-child{margin-top:-.15rem}

/* ---------- tables ---------- */
.tbl{width:100%;margin-top:1.3rem;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:30rem}
th{
  text-align:left;font-weight:600;font-size:.78rem;color:var(--muted);
  padding:0 1rem .55rem 0;border-bottom:1px solid var(--rule);letter-spacing:.02em;
}
td{padding:.7rem 1rem .7rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td:first-child{color:var(--text);font-weight:500}
table.cells td:first-child{color:var(--cue);font-family:"IBM Plex Mono",monospace;width:3rem}
table.knobs td:first-child{color:var(--cue);font-family:"IBM Plex Mono",monospace;width:15rem;font-size:.86rem}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);padding:2.2rem var(--shell) 3rem;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:.8rem 2rem;justify-content:space-between}
footer p{max-width:46ch}
:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="mark"><i class="dot"></i><b>colab-legends</b></div>
  <div class="switch" role="group" id="switch">
    <i class="thumb" id="thumb"></i>
    <button type="button" data-set="pt" aria-pressed="true">Português</button>
    <button type="button" data-set="en" aria-pressed="false">English</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer><div class="wrap" id="foot"></div></footer>

/* text with `backticks` -> <code>, escaped */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tx  = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const ps  = arr => (arr || []).map(p => `<p>${tx(p)}</p>`).join('');
const pre = code => code ? `<pre>${code.split('\n').map(l => `<span class="p">&gt;</span> ${esc(l)}`).join('\n')}</pre>` : '';
const table = (t, cls) => !t ? '' : `
  <h2>${esc(t.title)}</h2>
  <div class="tbl"><table class="${cls || ''}">
    <thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${tx(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>${t.note ? `<p class="note">${tx(t.note)}</p>` : ''}`;

const SYS = ['bin','boot','dev','etc','lib','usr','var'];

function render(d){
  const flow = d.hero.flow.map((f, i) =>
    `<div class="node"><div class="f mono">${esc(f)}</div><div class="n">${esc(d.hero.flowNotes[i] || '')}</div></div>`
  ).join('<i class="link"></i>');

  const steps = d.steps.map(s => `
    <div class="step">
      <div class="gutter"><div class="n">${esc(s.n)}</div><div class="t">${esc(s.time || '')}</div></div>
      <div><h3>${tx(s.title)}</h3><div class="body">${ps(s.body)}</div>
        ${s.list && s.list.length ? `<ol class="acts">${s.list.map(l => `<li>${tx(l)}</li>`).join('')}</ol>` : ''}
        ${pre(s.code)}
        ${s.note ? `<p class="note">${tx(s.note)}</p>` : ''}
      </div>
    </div>`).join('');

  const c = d.critical;
  const tree = `<div class="tree">
      <div class="l root">/</div>
      ${SYS.map(f => `<div class="l">&nbsp;&nbsp;${f}/</div>`).join('')}
      <div class="l hit">&nbsp;&nbsp;content/</div>
      <div class="l file">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;seu_audio.mp3</div>
    </div>`;
  const verdicts = `<div class="verdicts">
      <div class="v yes"><div class="s">&check;</div><div><div class="p"><b>${esc(c.right.path)}</b> &mdash; ${esc(c.right.label)}</div><div class="p">${tx(c.right.text)}</div></div></div>
      ${c.wrong.map(w => `<div class="v no"><div class="s">&times;</div><div><div class="p"><b>${esc(w.path)}</b></div><div class="p">${tx(w.text)}</div></div></div>`).join('')}
    </div>`;

  const ex = d.explainers ? `
    <section id="under">
      <h2>${esc(d.explainers.title)}</h2>
      <p class="lede muted">${tx(d.explainers.hint)}</p>
      <div class="cards">${d.explainers.items.map(i => `
        <details class="card"><summary><i class="chev"></i>${tx(i.q)}</summary>
          <div class="ans">${ps(i.a)}</div></details>`).join('')}</div>
    </section>` : '';

  const toc = [['setup', d.setup.title], ['passos', d.steps[0].title], ['content', c.title],
               ['under', d.explainers ? d.explainers.title : ''], ['tempo', d.timing.title],
               ['problemas', d.trouble.title]]
    .filter(x => x[1]).map(([id, t]) => `<a href="#${id}">${esc(t.replace(/`/g, ''))}</a>`).join('');

  document.getElementById('app').innerHTML = `
    <section class="hero">
      <p class="kicker">${tx(d.hero.kicker)}</p>
      <h1>${tx(d.hero.title)}</h1>
      <div class="frame"><span class="tc mono">00:00:00,000</span><div class="cue">${tx(d.hero.cue)}</div></div>
      <p class="lede">${tx(d.hero.lede)}</p>
      <div class="flow">${flow}</div>
      <nav class="toc" aria-label="${esc(d.tocLabel)}">${toc}</nav>
    </section>

    <section id="setup">
      <p class="kicker">${tx(d.setup.eyebrow)}</p>
      <h2>${tx(d.setup.title)}</h2>
      <div class="body">${ps(d.setup.body)}</div>
      ${pre(d.setup.code)}
      ${d.setup.note ? `<p class="note">${tx(d.setup.note)}</p>` : ''}
    </section>

    <section id="passos">${steps}</section>

    <section id="content">
      <div class="crit">
        <span class="flag">${esc(c.flag)}</span>
        <h2>${tx(c.title)}</h2>
        <div class="body">${ps(c.body)}</div>
        <div class="split">${tree}${verdicts}</div>
        ${c.note ? `<p class="note">${tx(c.note)}</p>` : ''}
      </div>
    </section>

    ${ex}

    <section id="tempo">${table(d.timing)}</section>
    <section id="problemas">${table(d.trouble)}</section>
    <section id="dentro">
      <h2>${tx(d.inside.title)}</h2>
      <div class="body">${ps(d.inside.body)}</div>
      <div class="tbl"><table class="cells"><tbody>
        ${d.inside.cells.map(r => `<tr><td>${esc(r[0])}</td><td>${tx(r[1])}</td></tr>`).join('')}
      </tbody></table></div>
      ${d.inside.knobs ? `
        <h3 style="margin-top:2.2rem">${tx(d.inside.knobs.title)}</h3>
        <p class="body muted" style="margin-top:.5rem">${tx(d.inside.knobs.hint)}</p>
        ${d.inside.knobs.groups.map(g => `
          <h3 style="margin-top:1.8rem;font-size:.95rem;color:var(--muted)">${tx(g.title)}</h3>
          <div class="tbl"><table class="knobs"><tbody>
            ${g.items.map(r => `<tr><td>${tx(r[0])}</td><td>${tx(r[1])}</td></tr>`).join('')}
          </tbody></table></div>
          ${g.note ? `<p class="note">${tx(g.note)}</p>` : ''}`).join('')}` : ''}
      <div class="body" style="margin-top:1.3rem">${ps(d.inside.anchor)}</div>
    </section>
    <section id="arquivos">${table(d.files)}
      <h3 style="margin-top:2rem">${tx(d.cli.title)}</h3>
      <p class="body muted" style="margin-top:.5rem">${tx(d.cli.body)}</p>
      ${pre(d.cli.code)}
    </section>`;

  document.getElementById('foot').innerHTML =
    `<p>${tx(d.footer.tested)}</p><p>${tx(d.footer.credit)}</p>`;
}

/* ---------- language ---------- */
const sw = document.getElementById('switch');
const thumb = document.getElementById('thumb');

function moveThumb(btn){
  thumb.style.width = btn.offsetWidth + 'px';
  thumb.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
}
function setLang(lang, save){
  const deck = DECKS[lang];
  if(!deck) return;
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  sw.querySelectorAll('button').forEach(b => {
    const on = b.dataset.set === lang;
    b.setAttribute('aria-pressed', String(on));
    if(on) moveThumb(b);
  });
  render(deck);
  if(save) try{ localStorage.setItem('lang', lang); }catch(e){}
}
sw.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) setLang(b.dataset.set, true);
});
addEventListener('resize', () => {
  const on = sw.querySelector('[aria-pressed="true"]');
  if(on) moveThumb(on);
});

let start = (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
try{ const s = localStorage.getItem('lang'); if(s === 'pt' || s === 'en') start = s; }catch(e){}
setLang(DECKS[start] ? start : 'pt', false);
</script>
